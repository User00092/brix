[project]
name = "brix"
version = "0.1.0"
description = "Open-source Codex-powered browser automation with live human takeover"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Brix contributors" }]
keywords = ["browser-automation", "playwright", "codex", "agent", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "playwright>=1.52,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
brix = "brix.cli:main"

[dependency-groups]
dev = [
  "bandit>=1.8",
  "mypy>=1.16",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/brix"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["strix", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "COM", "DTZ", "T20", "RUF"]
ignore = ["S101", "S110", "COM812", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["brix"]

[tool.bandit]
exclude_dirs = ["tests", "strix"]
skips = ["B101", "B110"]
